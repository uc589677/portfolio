<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAI - All-in-One AI Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs3@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased" x-data="{ activeTab: 'chat' }">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
            <div>
                <!-- Logo -->
                <div class="p-6 flex items-center space-x-3">
                    <div class="bg-indigo-600 p-2 rounded-xl text-white font-bold text-xl">✨</div>
                    <span class="text-xl font-bold tracking-wider text-white">OmniAI</span>
                </div>

                <!-- Navigation Links -->
                <nav class="px-4 space-y-1">
                    <button @click="activeTab = 'chat'" :class="activeTab === 'chat' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition">
                        💬 AI Chatbot
                    </button>
                    <button @click="activeTab = 'image'" :class="activeTab === 'image' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition">
                        🎨 Image Generator
                    </button>
                    <button @click="activeTab = 'code'" :class="activeTab === 'code' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition">
                        💻 Code Assistant
                    </button>
                </nav>
            </div>

            <!-- User Profile Footer -->
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center space-x-3 px-2 py-2">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white">U</div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-semibold text-white truncate">Uday Choudhary</p>
                        <p class="text-xs text-indigo-400">Pro Plan</p>
                        <p class="text-[10px] text-slate-500 truncate mt-0.5">uc589677@gmail.com</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col bg-slate-950 overflow-y-auto">
            
            <!-- Top Navbar -->
            <header class="h-16 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900/50 backdrop-blur">
                <h1 class="text-lg font-semibold capitalize text-white" x-text="activeTab + ' Workspace'"></h1>
                <div class="flex items-center space-x-4">
                    <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs px-3 py-1 rounded-full font-medium">API Connected</span>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div class="flex-1 p-6 flex flex-col justify-between max-w-5xl w-full mx-auto">
                
                <!-- 1. Chat Tab -->
                <div x-show="activeTab === 'chat'" class="flex flex-col h-full space-y-4">
                    <div class="flex-1 space-y-4 overflow-y-auto pr-2">
                        <div class="flex items-start space-x-3">
                            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs">AI</div>
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl max-w-xl text-slate-200">
                                Hello Uday! Main aapka AI assistant hoon. Aaj main aapki kis cheez mein madad karoon?
                            </div>
                        </div>
                    </div>
                    <!-- Input Box -->
                    <div class="relative">
                        <input type="text" placeholder="Type a message or prompt..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-4 pl-4 pr-16 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-600 transition">
                        <button class="absolute right-3 top-3 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">Send</button>
                    </div>
                </div>

                <!-- 2. Image Generator Tab -->
                <div x-show="activeTab === 'image'" class="flex flex-col h-full space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                            <div>
                                <h3 class="text-md font-semibold text-white mb-2">Image Parameters</h3>
                                <p class="text-xs text-slate-400 mb-4">Describe the image you want to generate using text prompts.</p>
                                <textarea rows="4" placeholder="A futuristic cyberpunk city in neon lights..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-600 text-sm"></textarea>
                            </div>
                            <button class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-semibold transition mt-4">Generate Image</button>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-center text-slate-600 text-sm">
                            Generated preview will appear here
                        </div>
                    </div>
                </div>

                <!-- 3. Code Assistant Tab -->
                <div x-show="activeTab === 'code'" class="flex flex-col h-full space-y-4">
                    <div class="flex-1 flex flex-col space-y-3">
                        <textarea rows="6" placeholder="Paste your buggy code or describe the function you want to create..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-600"></textarea>
                        <button class="self-end bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-semibold transition">Debug & Write Code</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

</body>
</html>

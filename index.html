<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVerse - Upload & Download Anime</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <div class="flex flex-col md:flex-row h-[100dvh] overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex-col justify-between hidden md:flex">
            <div>
                <!-- Logo -->
                <div class="p-6 flex items-center space-x-3">
                    <div class="bg-rose-600 p-2 rounded-xl text-white font-bold text-xl">🍥</div>
                    <span class="text-xl font-bold tracking-wider text-white">AnimeVerse</span>
                </div>

                <!-- Navigation Links -->
                <nav class="px-4 space-y-1">
                    <button onclick="switchTab('home')" id="btn-home" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition bg-rose-600 text-white">
                        🏠 Home / Downloads
                    </button>
                    <button onclick="switchTab('upload')" id="btn-upload" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition text-slate-400 hover:bg-slate-800 hover:text-white">
                        📤 Upload Anime (Admin)
                    </button>
                </nav>
            </div>

            <!-- User Profile Footer -->
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center space-x-3 px-2 py-2">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-rose-500 to-purple-500 flex items-center justify-center font-bold text-white">U</div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-semibold text-white truncate">Uday Choudhary</p>
                        <p class="text-xs text-rose-400">Admin</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Mobile Top Bar -->
        <div class="md:hidden bg-slate-900 border-b border-slate-800 p-3 flex justify-around items-center shrink-0">
            <button onclick="switchTab('home')" id="mob-btn-home" class="text-xs px-4 py-2 rounded-lg font-medium bg-rose-600 text-white">🏠 Home</button>
            <button onclick="switchTab('upload')" id="mob-btn-upload" class="text-xs px-4 py-2 rounded-lg font-medium text-slate-400">📤 Upload</button>
        </div>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col bg-slate-950 overflow-hidden">
            
            <!-- Top Navbar -->
            <header class="h-14 border-b border-slate-800 flex items-center justify-between px-4 md:px-6 bg-slate-900/50 backdrop-blur shrink-0">
                <h1 id="page-title" class="text-base md:text-lg font-semibold text-white">Anime Library & Downloads</h1>
                <span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] md:text-xs px-2.5 py-1 rounded-full font-medium">Cloud Storage Ready</span>
            </header>

            <!-- Dynamic Content Area -->
            <div class="flex-1 p-4 md:p-6 overflow-y-auto max-w-6xl w-full mx-auto">
                
                <!-- 1. Home / Download Tab -->
                <div id="tab-home" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-white">Latest Anime Episodes</h2>
                        <input type="text" placeholder="Search anime..." class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-rose-600">
                    </div>

                    <!-- Anime Grid -->
                    <div id="anime-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Sample Anime Card -->
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between">
                            <div class="h-40 bg-slate-800 flex items-center justify-center text-slate-500 font-semibold">
                                Anime Poster
                            </div>
                            <div class="p-4 space-y-2">
                                <h3 class="font-bold text-white text-base">Naruto Shippuden - Ep 101</h3>
                                <p class="text-xs text-slate-400">Action, Adventure, Ninja</p>
                                <div class="pt-2 flex space-x-2">
                                    <a href="#" class="flex-1 text-center bg-rose-600 hover:bg-rose-500 text-white py-2 rounded-xl text-xs font-semibold transition">Download (720p)</a>
                                    <a href="#" class="px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-xl text-xs font-semibold transition">Watch</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Upload Tab (Admin Panel) -->
                <div id="tab-upload" class="hidden max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                    <h2 class="text-lg font-bold text-white mb-2">Upload New Anime Episode</h2>
                    
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Anime Title & Episode</label>
                            <input type="text" id="anime-title" placeholder="e.g., Jujutsu Kaisen Season 2 - Ep 01" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-rose-600">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Genres / Tags</label>
                            <input type="text" id="anime-genre" placeholder="e.g., Action, Supernatural" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-rose-600">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Video Download Link (Cloud URL / Mega / Drive)</label>
                            <input type="text" id="anime-link" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-rose-600">
                        </div>
                    </div>

                    <button onclick="uploadAnime()" class="w-full bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-semibold transition mt-2">Publish & Make Available</button>
                </div>

            </div>
        </main>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function switchTab(tabName) {
            document.getElementById('tab-home').classList.add('hidden');
            document.getElementById('tab-upload').classList.add('hidden');

            document.getElementById('btn-home').className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition text-slate-400 hover:bg-slate-800 hover:text-white";
            document.getElementById('btn-upload').className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition text-slate-400 hover:bg-slate-800 hover:text-white";

            document.getElementById('mob-btn-home').className = "text-xs px-4 py-2 rounded-lg font-medium text-slate-400";
            document.getElementById('mob-btn-upload').className = "text-xs px-4 py-2 rounded-lg font-medium text-slate-400";

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            if(tabName === 'home') {
                document.getElementById('btn-home').className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition bg-rose-600 text-white";
                document.getElementById('mob-btn-home').className = "text-xs px-4 py-2 rounded-lg font-medium bg-rose-600 text-white";
                document.getElementById('page-title').innerText = "Anime Library & Downloads";
            } else {
                document.getElementById('btn-upload').className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition bg-rose-600 text-white";
                document.getElementById('mob-btn-upload').className = "text-xs px-4 py-2 rounded-lg font-medium bg-rose-600 text-white";
                document.getElementById('page-title').innerText = "Admin Upload Panel";
            }
        }

        function uploadAnime() {
            const title = document.getElementById('anime-title').value.trim();
            const genre = document.getElementById('anime-genre').value.trim();
            const link = document.getElementById('anime-link').value.trim();

            if(!title || !link) {
                alert('Please fill out the title and download link!');
                return;
            }

            const grid = document.getElementById('anime-grid');
            const card = document.createElement('div');
            card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between";
            card.innerHTML = `
                <div class="h-40 bg-slate-800 flex items-center justify-center text-slate-500 font-semibold">
                    Anime Poster
                </div>
                <div class="p-4 space-y-2">
                    <h3 class="font-bold text-white text-base">${escapeHtml(title)}</h3>
                    <p class="text-xs text-slate-400">${escapeHtml(genre || 'Anime')}</p>
                    <div class="pt-2 flex space-x-2">
                        <a href="${escapeHtml(link)}" target="_blank" class="flex-1 text-center bg-rose-600 hover:bg-rose-500 text-white py-2 rounded-xl text-xs font-semibold transition">Download Video</a>
                    </div>
                </div>
            `;
            grid.prepend(card);
            alert('Anime uploaded successfully!');
            document.getElementById('anime-title').value = '';
            document.getElementById('anime-genre').value = '';
            document.getElementById('anime-link').value = '';
            switchTab('home');
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>

</body>
</html>

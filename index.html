<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AnimeHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08080f;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:65px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#11111c;
  border-bottom:1px solid #29293a;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  color:#fff;
  text-decoration:none;
  font-size:23px;
  font-weight:900;
}

.logo span{
  color:#ff3d81;
}

nav button{
  background:#ff3d81;
  color:white;
  border:0;
  border-radius:7px;
  padding:9px 13px;
  margin-left:5px;
}

.hero{
  padding:50px 7%;
  background:linear-gradient(180deg,#18182c,#08080f);
}

.hero h1{
  font-size:38px;
  margin:0 0 10px;
}

.hero p{
  color:#aaa;
}

.search{
  width:100%;
  max-width:500px;
  padding:15px;
  margin-top:15px;
  background:#11111c;
  color:#fff;
  border:1px solid #303044;
  border-radius:8px;
}

.container{
  width:90%;
  max-width:1200px;
  margin:30px auto;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(160px,1fr));
  gap:17px;
}

.card{
  background:#141420;
  border-radius:9px;
  overflow:hidden;
  cursor:pointer;
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
}

.card-info{
  padding:11px;
}

.card-info h3{
  margin:0 0 7px;
  font-size:15px;
}

.card-info p{
  color:#999;
  margin:0;
  font-size:12px;
}

.page{
  display:none;
}

.detail{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:25px;
}

.detail img{
  width:100%;
  border-radius:10px;
}

.genre{
  color:#ff3d81;
}

.description{
  color:#aaa;
  line-height:1.6;
}

.episode{
  display:block;
  width:100%;
  max-width:700px;
  padding:14px;
  margin:9px 0;
  background:#171725;
  color:white;
  border:1px solid #303044;
  border-radius:8px;
  text-align:left;
}

.player{
  margin-top:30px;
}

.player video{
  width:100%;
  max-height:600px;
  background:#000;
  border-radius:10px;
}

.download{
  display:inline-block;
  margin-top:12px;
  padding:12px 17px;
  background:#ff3d81;
  color:white;
  text-decoration:none;
  border-radius:7px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.9);
  padding:20px;
  overflow:auto;
}

.box{
  width:100%;
  max-width:500px;
  margin:20px auto;
  background:#141420;
  padding:22px;
  border-radius:12px;
}

.close{
  float:right;
  background:#292936;
  color:#fff;
  border:0;
  border-radius:50%;
  width:32px;
  height:32px;
  font-size:18px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin:8px 0 14px;
  background:#090912;
  color:#fff;
  border:1px solid #303044;
  border-radius:7px;
}

textarea{
  min-height:100px;
}

.primary{
  width:100%;
  padding:14px;
  background:#ff3d81;
  color:#fff;
  border:0;
  border-radius:7px;
  font-weight:bold;
}

.admin-card{
  background:#141420;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

.delete{
  background:#c62828;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:6px;
}

.admin-item{
  padding:12px 0;
  border-bottom:1px solid #29293a;
  display:flex;
  justify-content:space-between;
}

@media(max-width:600px){

  .detail{
    grid-template-columns:130px 1fr;
  }

  .hero h1{
    font-size:32px;
  }

  .grid{
    grid-template-columns:
    repeat(2,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header>

<a class="logo" href="#" onclick="home()">
ANIME<span>HUB</span>
</a>

<nav>
<button onclick="openLogin()">Admin</button>
</nav>

</header>


<section id="homePage">

<section class="hero">

<h1>Anime World</h1>

<p>Watch your anime collection online.</p>

<input
class="search"
id="search"
placeholder="Search anime..."
>

</section>


<main class="container">

<h2>Anime Collection</h2>

<div id="grid" class="grid">
Loading...
</div>

</main>

</section>


<section id="detailPage" class="page">

<main class="container">

<button
class="episode"
onclick="home()"
>
← Back
</button>

<div id="detail"></div>

</main>

</section>


<section id="adminPage" class="page">

<main class="container">

<h1>Admin Panel</h1>

<div class="admin-card">

<h2>Add Anime</h2>

<input
id="animeTitle"
placeholder="Anime title"
>

<input
id="animeGenre"
placeholder="Genre"
>

<textarea
id="animeDescription"
placeholder="Description"
></textarea>

<label>Poster</label>

<input
id="poster"
type="file"
accept="image/*"
>

<button
class="primary"
onclick="addAnime()"
>
Upload Anime
</button>

<p id="animeMsg"></p>

</div>


<div class="admin-card">

<h2>Add Episode</h2>

<select id="animeSelect"></select>

<input
id="episodeNumber"
type="number"
placeholder="Episode number"
>

<input
id="episodeTitle"
placeholder="Episode title"
>

<label>Video</label>

<input
id="video"
type="file"
accept="video/*"
>

<button
class="primary"
onclick="addEpisode()"
>
Upload Episode
</button>

<p id="episodeMsg"></p>

</div>


<div class="admin-card">

<h2>Anime List</h2>

<div id="adminList"></div>

</div>

<button
class="delete"
onclick="logout()"
>
Logout
</button>

</main>

</section>


<!-- LOGIN -->

<div id="loginModal" class="modal">

<div class="box">

<button
class="close"
onclick="closeLogin()"
>
×
</button>

<h2>Admin Login</h2>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button
class="primary"
onclick="login()"
>
Login
</button>

<p id="loginMsg"></p>

</div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   HOME
========================================= */

let animeList=[];


async function loadAnime(){

const {data,error}=

await supabaseClient
.from("anime")
.select("*")
.order("created_at",{ascending:false});


if(error){

console.error(error);

document.getElementById("grid")
.innerHTML="<p>Unable to load anime.</p>";

return;

}


animeList=data || [];

renderAnime(animeList);

}


function renderAnime(list){

const grid=
document.getElementById("grid");


if(!list.length){

grid.innerHTML=
"<p>No anime available.</p>";

return;

}


grid.innerHTML=list.map(a=>`

<div
class="card"
onclick="openAnime('${a.id}')"
>

<img
src="${
a.poster_url ||
'https://placehold.co/300x430?text=Anime'
}"
>

<div class="card-info">

<h3>
${escapeHTML(a.title)}
</h3>

<p>
${escapeHTML(a.genre || "Anime")}
</p>

</div>

</div>

`).join("");

}


document
.getElementById("search")
.addEventListener("input",function(){

const q=
this.value
.toLowerCase()
.trim();


renderAnime(
animeList.filter(a=>
a.title
.toLowerCase()
.includes(q)
)
);

});


/* =========================================
   ANIME DETAIL
========================================= */

async function openAnime(id){

document
.getElementById("homePage")
.style.display="none";


document
.getElementById("adminPage")
.style.display="none";


document
.getElementById("detailPage")
.style.display="block";


const {data:anime}=

await supabaseClient
.from("anime")
.select("*")
.eq("id",id)
.single();


if(!anime)return;


const {data:episodes}=

await supabaseClient
.from("episodes")
.select("*")
.eq("anime_id",id)
.order("episode_number");


document
.getElementById("detail")
.innerHTML=`

<div class="detail">

<img
src="${
anime.poster_url ||
'https://placehold.co/300x430?text=Anime'
}"
>

<div>

<h1>
${escapeHTML(anime.title)}
</h1>

<p class="genre">
${escapeHTML(anime.genre || "Anime")}
</p>

<p class="description">
${escapeHTML(anime.description || "")}
</p>

</div>

</div>


<br>

<h2>Episodes</h2>

<div>

${
episodes?.length
?
episodes.map(e=>`

<button
class="episode"
onclick="playEpisode(
'${e.video_url}',
'${escapeHTML(
e.title ||
'Episode '+e.episode_number
)}'
)"
>

▶ Episode ${e.episode_number}

${
e.title
?
" - "+escapeHTML(e.title)
:""
}

</button>

`).join("")
:
"<p>No episodes available.</p>"
}

</div>

<div
id="player"
class="player"
></div>

`;

}


function playEpisode(url,title){

document
.getElementById("player")
.innerHTML=`

<h2>${title}</h2>

<video
controls
autoplay
playsinline
>

<source src="${url}">

</video>

<br>

<a
class="download"
href="${url}"
download
target="_blank"
>
⬇ Download Episode
</a>

`;

}


/* =========================================
   HOME
========================================= */

function home(){

document
.getElementById("homePage")
.style.display="block";


document
.getElementById("detailPage")
.style.display="none";


document
.getElementById("adminPage")
.style.display="none";

}


/* =========================================
   LOGIN
========================================= */

function openLogin(){

document
.getElementById("loginModal")
.style.display="block";

}


function closeLogin(){

document
.getElementById("loginModal")
.style.display="none";

}


async function login(){

const email=
document.getElementById("email")
.value.trim();


const password=
document.getElementById("password")
.value;


const {error}=

await supabaseClient
.auth
.signInWithPassword({
email,
password
});


if(error){

document
.getElementById("loginMsg")
.textContent=
error.message;

return;

}


closeLogin();

await openAdmin();

}


/* =========================================
   ADMIN
========================================= */

async function openAdmin(){

const {
data:{user}
}=

await supabaseClient
.auth
.getUser();


if(!user){

openLogin();

return;

}


const {data:profile}=

await supabaseClient
.from("profiles")
.select("is_admin")
.eq("id",user.id)
.single();


if(!profile?.is_admin){

alert("You are not an admin.");

await logout();

return;

}


document
.getElementById("homePage")
.style.display="none";


document
.getElementById("detailPage")
.style.display="none";


document
.getElementById("adminPage")
.style.display="block";


loadAdminAnime();

}


/* =========================================
   ADD ANIME
========================================= */

async function addAnime(){

const {
data:{user}
}=

await supabaseClient
.auth
.getUser();


const title=
document.getElementById("animeTitle")
.value.trim();


const genre=
document.getElementById("animeGenre")
.value.trim();


const description=
document.getElementById("animeDescription")
.value.trim();


const poster=
document.getElementById("poster")
.files[0];


if(!title){

alert("Anime title required.");

return;

}


let posterURL=null;


if(poster){

const extension=
poster.name
.split(".")
.pop();


const filename=
crypto.randomUUID()+"."+extension;


const path=
user.id+"/"+filename;


const {error}=

await supabaseClient
.storage
.from("posters")
.upload(
path,
poster,
{
contentType:poster.type
}
);


if(error){

alert(error.message);

return;

}


const {data}=

supabaseClient
.storage
.from("posters")
.getPublicUrl(path);


posterURL=data.publicUrl;

}


const {error}=

await supabaseClient
.from("anime")
.insert({

title:title,

genre:genre,

description:description,

poster_url:posterURL,

created_by:user.id

});


if(error){

alert(error.message);

return;

}


document
.getElementById("animeMsg")
.textContent=
"Anime uploaded successfully.";


document
.getElementById("animeTitle")
.value="";


document
.getElementById("animeGenre")
.value="";


document
.getElementById("animeDescription")
.value="";


document
.getElementById("poster")
.value="";


loadAdminAnime();

loadAnime();

}


/* =========================================
   ADD EPISODE
========================================= */

async function addEpisode(){

const {
data:{user}
}=

await supabaseClient
.auth
.getUser();


const animeId=
document.getElementById("animeSelect")
.value;


const number=
document.getElementById("episodeNumber")
.value;


const title=
document.getElementById("episodeTitle")
.value.trim();


const video=
document.getElementById("video")
.files[0];


if(!animeId || !number || !video){

alert(
"Anime, episode number and video required."
);

return;

}


const extension=
video.name
.split(".")
.pop();


const filename=
crypto.randomUUID()+"."+extension;


const path=
user.id+
"/"+
animeId+
"/"+
filename;


const {error:uploadError}=

await supabaseClient
.storage
.from("videos")
.upload(
path,
video,
{
contentType:video.type
}
);


if(uploadError){

alert(uploadError.message);

return;

}


const {data}=

supabaseClient
.storage
.from("videos")
.getPublicUrl(path);


const videoURL=
data.publicUrl;


const {error}=

await supabaseClient
.from("episodes")
.insert({

anime_id:animeId,

episode_number:Number(number),

title:title,

video_url:videoURL,

created_by:user.id

});


if(error){

alert(error.message);

return;

}


document
.getElementById("episodeMsg")
.textContent=
"Episode uploaded successfully.";


document
.getElementById("episodeNumber")
.value="";


document
.getElementById("episodeTitle")
.value="";


document
.getElementById("video")
.value="";


}


/* =========================================
   ADMIN LIST
========================================= */

async function loadAdminAnime(){

const {data}=

await supabaseClient
.from("anime")
.select("*")
.order("created_at",{ascending:false});


const select=
document.getElementById("animeSelect");


select.innerHTML=
data?.map(a=>`

<option value="${a.id}">
${escapeHTML(a.title)}
</option>

`).join("") ||
"<option>No anime</option>";


const list=
document.getElementById("adminList");


list.innerHTML=
data?.map(a=>`

<div class="admin-item">

<span>
${escapeHTML(a.title)}
</span>

<button
class="delete"
onclick="deleteAnime('${a.id}')"
>
Delete
</button>

</div>

`).join("") ||
"<p>No anime.</p>";

}


/* =========================================
   DELETE
========================================= */

async function deleteAnime(id){

if(!confirm(
"Delete this anime and its episodes?"
))return;


const {error}=

await supabaseClient
.from("anime")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadAdminAnime();

loadAnime();

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

await supabaseClient
.auth
.signOut();


document
.getElementById("adminPage")
.style.display="none";


document
.getElementById("detailPage")
.style.display="none";


document
.getElementById("homePage")
.style.display="block";

}


/* =========================================
   START
========================================= */

loadAnime();

</script>

</body>
</html>

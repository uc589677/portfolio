<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>AnimeHub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#08080f;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#11111c;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #272738;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.logo span{
  color:#ff3d81;
}

.header-btn{
  background:#ff3d81;
  border:0;
  color:white;
  padding:9px 13px;
  border-radius:8px;
  font-weight:bold;
}

.hero{
  padding:35px 18px;
  background:
    linear-gradient(180deg,#151529,#08080f);
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  color:#aaa;
  margin-bottom:20px;
}

.search{
  width:100%;
  padding:15px;
  background:#151522;
  border:1px solid #303044;
  border-radius:10px;
  color:#fff;
  outline:none;
  font-size:16px;
}

.container{
  padding:20px 16px;
}

.section-title{
  margin-bottom:18px;
  font-size:22px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:14px;
}

.card{
  background:#141420;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #242437;
  cursor:pointer;
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#20202d;
}

.card-info{
  padding:10px;
}

.card-title{
  font-size:15px;
  font-weight:bold;
  margin-bottom:5px;
}

.card-meta{
  color:#888;
  font-size:12px;
}

.empty{
  text-align:center;
  color:#777;
  padding:50px 10px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:100;
  overflow:auto;
  padding:20px;
}

.modal-box{
  max-width:600px;
  margin:20px auto;
  background:#13131f;
  border:1px solid #303044;
  border-radius:14px;
  padding:20px;
}

.close{
  float:right;
  background:#292936;
  border:0;
  color:#fff;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

.modal h2{
  margin-bottom:20px;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#ccc;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #343449;
  background:#090912;
  color:#fff;
  outline:none;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  width:100%;
  margin-top:18px;
  padding:14px;
  background:#ff3d81;
  color:white;
  border:0;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
}

.anime-detail{
  display:none;
  padding:20px 16px;
}

.back{
  background:#222230;
  color:#fff;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  margin-bottom:20px;
}

.detail-top{
  display:flex;
  gap:18px;
}

.detail-poster{
  width:130px;
  height:195px;
  object-fit:cover;
  border-radius:9px;
}

.detail-info{
  flex:1;
}

.detail-info h1{
  font-size:23px;
  margin-bottom:10px;
}

.genre{
  color:#ff3d81;
  margin-bottom:10px;
  font-size:13px;
}

.description{
  color:#aaa;
  line-height:1.5;
  font-size:14px;
}

.episode-list{
  margin-top:25px;
}

.episode{
  width:100%;
  padding:14px;
  margin-bottom:9px;
  background:#171725;
  border:1px solid #29293c;
  color:#fff;
  border-radius:8px;
  text-align:left;
}

.episode:hover{
  background:#ff3d81;
}

.player{
  margin-top:20px;
}

.player video{
  width:100%;
  max-height:60vh;
  background:#000;
  border-radius:10px;
}

.player-title{
  margin:12px 0;
}

.delete{
  background:#c62828;
  color:white;
  border:0;
  padding:10px 14px;
  border-radius:8px;
  margin-top:15px;
}

.status{
  margin-top:12px;
  color:#ff3d81;
  text-align:center;
}

@media(max-width:350px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    ANIME<span>HUB</span>
  </div>

  <button class="header-btn"
          onclick="openAdmin()">
    + Upload
  </button>
</header>

<section class="hero" id="homeHero">

  <h1>Anime World</h1>

  <p>
    Your personal anime collection
  </p>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search anime..."
  >

</section>

<main class="container" id="home">

  <h2 class="section-title">
    Anime Collection
  </h2>

  <div id="animeGrid" class="grid"></div>

</main>

<section id="animeDetail"
         class="anime-detail">

  <button class="back"
          onclick="showHome()">
    ← Back
  </button>

  <div id="detailContent"></div>

</section>


<!-- ADMIN MODAL -->

<div id="adminModal"
     class="modal">

  <div class="modal-box">

    <button class="close"
            onclick="closeAdmin()">
      ×
    </button>

    <h2>Add Anime</h2>

    <label>Anime Name</label>

    <input
      id="animeName"
      placeholder="Example: My Anime"
    >

    <label>Genre</label>

    <input
      id="animeGenre"
      placeholder="Action, Fantasy..."
    >

    <label>Description</label>

    <textarea
      id="animeDescription"
      placeholder="Anime description..."
    ></textarea>

    <label>Poster</label>

    <input
      id="animePoster"
      type="file"
      accept="image/*"
    >

    <button class="primary"
            onclick="addAnime()">
      Add Anime
    </button>

    <p id="status"
       class="status"></p>

  </div>

</div>


<!-- EPISODE MODAL -->

<div id="episodeModal"
     class="modal">

  <div class="modal-box">

    <button class="close"
            onclick="closeEpisode()">
      ×
    </button>

    <h2>Add Episode</h2>

    <input
      type="hidden"
      id="episodeAnimeId"
    >

    <label>Episode Number</label>

    <input
      id="episodeNumber"
      type="number"
      min="1"
      placeholder="1"
    >

    <label>Episode Title</label>

    <input
      id="episodeTitle"
      placeholder="Episode title"
    >

    <label>Video</label>

    <input
      id="episodeVideo"
      type="file"
      accept="video/*"
    >

    <button class="primary"
            onclick="addEpisode()">
      Upload Episode
    </button>

    <p id="episodeStatus"
       class="status"></p>

  </div>

</div>


<script>

const DB_NAME = "AnimeHubDB";
const STORE = "anime";

let db;
let currentAnime = null;


/* =========================
   DATABASE
========================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME,1);

    request.onupgradeneeded = e => {

      const database = e.target.result;

      if(!database.objectStoreNames
         .contains(STORE)){

        database.createObjectStore(
          STORE,
          {keyPath:"id"}
        );

      }

    };

    request.onsuccess = e => {

      db = e.target.result;

      resolve(db);

    };

    request.onerror = () =>
      reject(request.error);

  });

}


function getAllAnime(){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(STORE,"readonly");

    const store =
      tx.objectStore(STORE);

    const request =
      store.getAll();

    request.onsuccess = () =>
      resolve(request.result);

    request.onerror = () =>
      reject(request.error);

  });

}


function saveAnime(anime){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(STORE,"readwrite");

    tx.objectStore(STORE)
      .put(anime);

    tx.oncomplete = resolve;

    tx.onerror = () =>
      reject(tx.error);

  });

}


function deleteAnime(id){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(STORE,"readwrite");

    tx.objectStore(STORE)
      .delete(id);

    tx.oncomplete = resolve;

    tx.onerror = () =>
      reject(tx.error);

  });

}


/* =========================
   HOME
========================= */

async function renderHome(){

  const anime =
    await getAllAnime();

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    anime.filter(a =>
      a.name.toLowerCase()
       .includes(search)
    );

  const grid =
    document.getElementById("animeGrid");

  if(filtered.length === 0){

    grid.innerHTML = `
      <div class="empty">
        No anime found.
        <br><br>
        Tap "+ Upload" to add one.
      </div>
    `;

    return;

  }

  grid.innerHTML =
    filtered.map(a => `

      <div class="card"
           onclick="openAnime('${a.id}')">

        ${
          a.poster
          ?
          `<img class="poster"
                src="${URL.createObjectURL(a.poster)}">`
          :
          `<div class="poster"></div>`
        }

        <div class="card-info">

          <div class="card-title">
            ${escapeHTML(a.name)}
          </div>

          <div class="card-meta">
            ${escapeHTML(a.genre || "Anime")}
            •
            ${a.episodes.length} Episodes
          </div>

        </div>

      </div>

    `).join("");

}


/* =========================
   OPEN ANIME
========================= */

async function openAnime(id){

  const anime =
    (await getAllAnime())
    .find(a => a.id === id);

  if(!anime) return;

  currentAnime = anime;

  document.getElementById("home")
    .style.display = "none";

  document.getElementById("homeHero")
    .style.display = "none";

  document.getElementById("animeDetail")
    .style.display = "block";

  const poster =
    anime.poster
    ?
    URL.createObjectURL(anime.poster)
    :
    "";

  document.getElementById("detailContent")
    .innerHTML = `

      <div class="detail-top">

        ${
          poster
          ?
          `<img class="detail-poster"
                src="${poster}">`
          :
          ""
        }

        <div class="detail-info">

          <h1>
            ${escapeHTML(anime.name)}
          </h1>

          <div class="genre">
            ${escapeHTML(anime.genre || "Anime")}
          </div>

          <div class="description">
            ${escapeHTML(anime.description || "")}
          </div>

        </div>

      </div>


      <div class="episode-list">

        <h2>Episodes</h2>

        ${
          anime.episodes.length
          ?
          anime.episodes
            .map((ep,i)=>`

              <button class="episode"
                onclick="playEpisode(${i})">

                ▶ Episode ${ep.number}
                ${ep.title
                  ? " - "+escapeHTML(ep.title)
                  : ""}

              </button>

            `).join("")
          :
          `<p class="empty">
             No episodes yet.
           </p>`
        }

        <button
          class="primary"
          onclick="openEpisode('${anime.id}')">

          + Add Episode

        </button>

        <button
          class="delete"
          onclick="removeCurrentAnime()">

          Delete Anime

        </button>

      </div>

      <div id="player"
           class="player">
      </div>

    `;

}


function showHome(){

  document.getElementById("animeDetail")
    .style.display = "none";

  document.getElementById("home")
    .style.display = "block";

  document.getElementById("homeHero")
    .style.display = "block";

  currentAnime = null;

  renderHome();

}


/* =========================
   VIDEO PLAYER
========================= */

function playEpisode(index){

  if(!currentAnime) return;

  const episode =
    currentAnime.episodes[index];

  const url =
    URL.createObjectURL(episode.video);

  document.getElementById("player")
    .innerHTML = `

      <h3 class="player-title">
        ${escapeHTML(
          episode.title ||
          "Episode "+episode.number
        )}
      </h3>

      <video controls
             autoplay
             playsinline>

        <source src="${url}">

        Your browser does not support
        video playback.

      </video>

    `;

}


/* =========================
   ADMIN
========================= */

function openAdmin(){

  document.getElementById("adminModal")
    .style.display = "block";

}

function closeAdmin(){

  document.getElementById("adminModal")
    .style.display = "none";

}


async function addAnime(){

  const name =
    document.getElementById("animeName")
      .value.trim();

  if(!name){

    alert("Anime name required.");

    return;

  }

  const posterInput =
    document.getElementById("animePoster");

  const poster =
    posterInput.files[0] || null;

  const anime = {

    id:
      Date.now().toString(),

    name,

    genre:
      document.getElementById("animeGenre")
        .value.trim(),

    description:
      document.getElementById("animeDescription")
        .value.trim(),

    poster,

    episodes:[],

    createdAt:
      new Date().toISOString()

  };

  await saveAnime(anime);

  document.getElementById("status")
    .textContent =
      "Anime added successfully!";

  document.getElementById("animeName")
    .value = "";

  document.getElementById("animeGenre")
    .value = "";

  document.getElementById("animeDescription")
    .value = "";

  document.getElementById("animePoster")
    .value = "";

  await renderHome();

}


/* =========================
   EPISODE
========================= */

function openEpisode(id){

  document.getElementById("episodeAnimeId")
    .value = id;

  document.getElementById("episodeModal")
    .style.display = "block";

}


function closeEpisode(){

  document.getElementById("episodeModal")
    .style.display = "none";

}


async function addEpisode(){

  const id =
    document.getElementById("episodeAnimeId")
      .value;

  const anime =
    (await getAllAnime())
      .find(a => a.id === id);

  if(!anime) return;


  const number =
    document.getElementById("episodeNumber")
      .value;

  const title =
    document.getElementById("episodeTitle")
      .value.trim();

  const video =
    document.getElementById("episodeVideo")
      .files[0];


  if(!number || !video){

    alert(
      "Episode number and video are required."
    );

    return;

  }


  anime.episodes.push({

    id:
      Date.now().toString(),

    number:
      Number(number),

    title,

    video

  });


  await saveAnime(anime);

  document.getElementById("episodeStatus")
    .textContent =
      "Episode uploaded successfully!";


  document.getElementById("episodeNumber")
    .value = "";

  document.getElementById("episodeTitle")
    .value = "";

  document.getElementById("episodeVideo")
    .value = "";


  currentAnime = anime;

  closeEpisode();

  openAnime(id);

}


/* =========================
   DELETE
========================= */

async function removeCurrentAnime(){

  if(!currentAnime) return;

  const confirmDelete =
    confirm(
      "Delete this anime and all episodes?"
    );

  if(!confirmDelete) return;

  await deleteAnime(currentAnime.id);

  showHome();

}


/* =========================
   SEARCH
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderHome
  );


/* =========================
   SECURITY / TEXT
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

(async function(){

  try{

    await openDB();

    await renderHome();

  }catch(error){

    console.error(error);

    alert(
      "Browser storage could not be opened."
    );

  }

})();

</script>

</body>
</html>
